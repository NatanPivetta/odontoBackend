spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/odonto
    username: odonto
    password: odonto

  jpa:
    show-sql: true

  devtools:
    restart:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    br.ufrgs.odonto: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET:local-dev-insecure-jwt-secret-do-not-use-in-production-override-via-env-0000000000}