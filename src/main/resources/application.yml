# ─────────────────────────────────────────────────────────────
# Configurações comuns a todos os perfis
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: odonto

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # ── Banco de dados ────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/odonto}
    username: ${SPRING_DATASOURCE_USERNAME:odonto}
    password: ${SPRING_DATASOURCE_PASSWORD:odonto}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OdontoHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  # ── Liquibase ─────────────────────────────────────────────
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

  # ── Jackson ───────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: America/Sao_Paulo

# ── Servidor ──────────────────────────────────────────────────
server:
  port: 8090
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ── JWT ───────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:bzj8uj6rVyned4cHiTIh0MgVOOdcKnA3F8hfrti8yrCNMyJJqtoFF677draKF6+VAw1TEqNUsxMg9T166nyiKw==bzj8uj6rVyned4cHiTIh0MgVOOdcKnA3F8hfrti8yrCNMyJJqtoFF677draKF6+VAw1TEqNUsxMg9T166nyiKw==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ── OpenAPI / Swagger ─────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ── Logs ──────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"