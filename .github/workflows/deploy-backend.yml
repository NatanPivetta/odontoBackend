name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: necessário para assumir a role na AWS sem chaves de longa duração
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: odonto-dev-backend           # === bater com aws_ecr_repository.backend ===
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  build-and-deploy:
    name: Build, push e deploycd
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ─────────────────────────────────────────────
#      - name: Tests
#        run: ./mvnw -B test
#        # Remova esta etapa se quiser pular os testes no CI

      # ─────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region:     ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────────
      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────────────────────
      - name: Build, tag e push da imagem
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image_tag=$IMAGE_TAG"   >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI"   >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ steps.build-image.outputs.image_tag }}
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy odonto-api $IMAGE_TAG" \
            --parameters "commands=[\"/opt/odonto/run.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado: $CMD_ID"

          # Aguarda completar
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" --output text)

          echo "Status final: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" --output text >&2
            exit 1
          fi
