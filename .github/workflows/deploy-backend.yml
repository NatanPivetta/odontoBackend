name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: necessário para assumir a role na AWS sem chaves de longa duração
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: odonto-dev-backend           # === bater com aws_ecr_repository.backend ===
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  build-and-deploy:
    name: Build, push e deploycd
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ─────────────────────────────────────────────
#      - name: Tests
#        run: ./mvnw -B test
#        # Remova esta etapa se quiser pular os testes no CI

      # ─────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region:     ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────────
      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────────────────────
      - name: Build, tag e push da imagem
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image_tag=$IMAGE_TAG"   >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI"   >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      - name: Reescrever run.sh na EC2
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Gera o run.sh completo e correto com todos os valores substituidos
          cat > /tmp/run.sh << RUNSH
          #!/bin/bash
          set -euo pipefail

          REGION="${AWS_REGION}"
          ACCOUNT_ID="${ACCOUNT_ID}"
          ECR_REPO="${ECR_REPOSITORY}"
          APP_PORT="8090"
          PARAM_PREFIX="/odonto-dev"
          SPRING_PROFILE="dev"
          FRONTEND_ORIGIN="https://odonto-ufrgs.vercel.app,http://localhost:3000"
          JAVA_TOOL_OPTIONS_VALUE="-Xmx512m -Xss512k -XX:MaxMetaspaceSize=128m"

          TAG="\${1:-\$(cat /opt/odonto/current_tag 2>/dev/null || echo latest)}"
          echo "\$TAG" >/opt/odonto/current_tag

          REGISTRY="\${ACCOUNT_ID}.dkr.ecr.\${REGION}.amazonaws.com"
          IMAGE="\${REGISTRY}/\${ECR_REPO}:\${TAG}"

          aws ecr get-login-password --region "\$REGION" | docker login --username AWS --password-stdin "\$REGISTRY"

          get_param () {
            aws ssm get-parameter --region "\$REGION" --name "\$1" --with-decryption --query Parameter.Value --output text
          }

          DB_URL="\$(get_param "\${PARAM_PREFIX}/db/url")"
          DB_USER="\$(get_param "\${PARAM_PREFIX}/db/username")"
          DB_PASS="\$(get_param "\${PARAM_PREFIX}/db/password")"
          JWT_VALUE="\$(get_param "\${PARAM_PREFIX}/jwt/secret")"
          MAIL_USER="\$(get_param "\${PARAM_PREFIX}/mail/username")"
          MAIL_PASS="\$(get_param "\${PARAM_PREFIX}/mail/password")"

          docker pull "\$IMAGE"
          docker rm -f odonto-api 2>/dev/null || true

          docker run -d \
            --name odonto-api \
            --restart unless-stopped \
            -p 127.0.0.1:\${APP_PORT}:\${APP_PORT} \
            --memory=768m \
            --memory-swap=1536m \
            -e SPRING_PROFILES_ACTIVE="\$SPRING_PROFILE" \
            -e SPRING_DATASOURCE_URL="\$DB_URL" \
            -e SPRING_DATASOURCE_USERNAME="\$DB_USER" \
            -e SPRING_DATASOURCE_PASSWORD="\$DB_PASS" \
            -e JWT_SECRET="\$JWT_VALUE" \
            -e CORS_ALLOWED_ORIGINS="\$FRONTEND_ORIGIN" \
            -e MAIL_USERNAME="\$MAIL_USER" \
            -e MAIL_PASSWORD="\$MAIL_PASS" \
            -e JAVA_TOOL_OPTIONS="\$JAVA_TOOL_OPTIONS_VALUE" \
            --log-driver=journald \
            "\$IMAGE"

          docker image prune -f
          RUNSH

          # Envia para EC2 via SSM usando base64 para evitar problemas de escaping
          ENCODED=$(base64 -w 0 /tmp/run.sh)

          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg cmd "echo ${ENCODED} | base64 -d > /opt/odonto/run.sh && chmod +x /opt/odonto/run.sh && echo OK" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: "reescrever run.sh",
              Parameters: { commands: [$cmd] }
            }' > /tmp/ssm-runsh.json

          CMD_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-runsh.json \
            --query "Command.CommandId" --output text)
          echo "SSM enviado: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" --output text)
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text >&2
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]

      # ─────────────────────────────────────────────
      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ steps.build-image.outputs.image_tag }}
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy odonto-api $IMAGE_TAG" \
            --parameters "commands=[\"/opt/odonto/run.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado: $CMD_ID"

          # Polling custom: até 60 tentativas × 10 s = 10 minutos
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "Status final: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" --output text >&2
            exit 1
          fi
